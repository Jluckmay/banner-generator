<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a0d"/>
      <stop offset="100%" stop-color="#141720"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2a40"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="64" height="64" rx="12" fill="url(#bg)"/>
  <!-- Top accent bar -->
  <rect x="0" y="0" width="64" height="4" rx="2" fill="url(#accent)"/>
  <!-- Terminal tilde/slash: ~/ -->
  <text x="6" y="28" font-family="'Courier New', monospace" font-weight="900" font-size="14" fill="#ff2a40">~/</text>
  <!-- Poster rectangle outline -->
  <rect x="10" y="32" width="26" height="22" rx="2" fill="none" stroke="#2a3142" stroke-width="1.5"/>
  <!-- Poster lines inside (content representation) -->
  <line x1="13" y1="37" x2="33" y2="37" stroke="#ff2a40" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="13" y1="41" x2="30" y2="41" stroke="#7f8ba4" stroke-width="1" stroke-linecap="round"/>
  <line x1="13" y1="44" x2="32" y2="44" stroke="#7f8ba4" stroke-width="1" stroke-linecap="round"/>
  <line x1="13" y1="47" x2="28" y2="47" stroke="#7f8ba4" stroke-width="1" stroke-linecap="round"/>
  <!-- LaTeX "L" icon on right -->
  <text x="38" y="50" font-family="serif" font-size="20" font-weight="bold" fill="#fbbf24" opacity="0.9">L</text>
  <!-- Superscript A (LaTeX) -->
  <text x="49" y="44" font-family="serif" font-size="10" font-weight="bold" fill="#fbbf24" opacity="0.7">A</text>
</svg>
